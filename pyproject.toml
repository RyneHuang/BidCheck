[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bidcheck"
version = "1.0.0"
description = "围标检测系统 - 通过分析投标文档元数据识别围标风险"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "BidCheck Team" }
]
dependencies = [
    "python-docx>=0.21.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "oletools>=0.60.0",
    "olefile>=0.46",
    "click>=8.1.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
bidcheck = "bidcheck.cli.main:cli"
bidcheck-gui = "bidcheck.gui_launcher:main"

[project.gui-scripts]
bidcheck-gui = "bidcheck.gui_launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/bidcheck"]
